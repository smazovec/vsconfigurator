# Проверка PR и пушей в main, сборка VSIX без публикации в маркетплейсы.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npm run typecheck

      - name: Проверить линтером
        run: npm run lint

      - name: Скомпилировать
        run: npm run compile

      - name: Запустить тесты (через xvfb для Extension Host)
        run: xvfb-run -a npm test

      - name: Собрать VSIX
        run: npm run package

      - name: Сохранить VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  # Живой разбор argv и кодировки вывода на Windows, Linux и macOS, без Extension Host.
  processes:
    name: Процессы (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Скомпилировать
        run: npm run compile

      - name: Прогнать аргументы и кодировки через живые процессы
        run: npm run test:node
