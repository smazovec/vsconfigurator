<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
	/* Секция занимает минимум места: только строка ввода. */
	body {
		margin: 0;
		padding: 2px 8px 3px 8px;
		font-family: var(--vscode-font-family);
		font-size: var(--vscode-font-size);
		overflow: hidden;
	}
	.wrap {
		position: relative;
		display: block;
	}
	input {
		width: 100%;
		box-sizing: border-box;
		padding: 3px 22px 3px 6px;
		border-radius: 2px;
		border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
		background: var(--vscode-input-background);
		color: var(--vscode-input-foreground);
		font-family: inherit;
		font-size: inherit;
	}
	input:focus {
		outline: 1px solid var(--vscode-focusBorder);
		outline-offset: -1px;
	}
	input::placeholder {
		color: var(--vscode-input-placeholderForeground);
	}
	.clear {
		position: absolute;
		top: 50%;
		right: 4px;
		transform: translateY(-50%);
		border: none;
		background: transparent;
		color: var(--vscode-descriptionForeground);
		cursor: pointer;
		padding: 0 2px;
		font-size: 13px;
		line-height: 1;
	}
	.clear:hover {
		color: var(--vscode-foreground);
	}
	.clear.hidden {
		display: none;
	}
</style>
</head>
<body>
	<label class="wrap">
		<input id="q" type="text" placeholder="Поиск по метаданным…" autocomplete="off" />
		<button id="clear" class="clear hidden" type="button" title="Очистить">×</button>
	</label>
	<script>
		const vscodeApi = acquireVsCodeApi();
		const input = document.getElementById('q');
		const clearBtn = document.getElementById('clear');
		let timer;
		function send() {
			clearBtn.classList.toggle('hidden', input.value.length === 0);
			clearTimeout(timer);
			timer = setTimeout(function () {
				vscodeApi.postMessage({ type: 'search', query: input.value });
			}, {{DEBOUNCE_MS}});
		}
		input.addEventListener('input', send);
		input.addEventListener('keydown', function (e) {
			if (e.key === 'Escape' && input.value.length > 0) {
				input.value = '';
				send();
			}
		});
		clearBtn.addEventListener('click', function () {
			input.value = '';
			input.focus();
			send();
		});
		window.addEventListener('message', function (event) {
			if (!event.data) {
				return;
			}
			if (event.data.type === 'clear') {
				input.value = '';
				clearBtn.classList.add('hidden');
			}
			if (event.data.type === 'setQuery') {
				input.value = event.data.query || '';
				clearBtn.classList.toggle('hidden', input.value.length === 0);
			}
		});
		vscodeApi.postMessage({ type: 'ready' });
	</script>
</body>
</html>
