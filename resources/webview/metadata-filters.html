<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}}; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}';">
<style nonce="{{NONCE}}">
	body {
		margin: 0;
		padding: 4px 0 6px 0;
		font-family: var(--vscode-font-family);
		font-size: var(--vscode-font-size);
		color: var(--vscode-foreground);
	}
	.search {
		position: relative;
		padding: 0 8px 4px 8px;
	}
	.search input {
		width: 100%;
		box-sizing: border-box;
		padding: 3px 22px 3px 6px;
		border-radius: 2px;
		border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
		background: var(--vscode-input-background);
		color: var(--vscode-input-foreground);
		font-family: inherit;
		font-size: inherit;
	}
	.search input:focus {
		outline: 1px solid var(--vscode-focusBorder);
		outline-offset: -1px;
	}
	.search-clear {
		position: absolute;
		top: 2px;
		right: 12px;
		border: none;
		background: transparent;
		color: var(--vscode-descriptionForeground);
		cursor: pointer;
		font-size: 13px;
		line-height: 1;
	}
	.search-clear.hidden {
		display: none;
	}
	/* Геометрия строки — как у дерева метаданных: 22px, отступ уровня 8px, значок 16px. */
	.row {
		display: flex;
		align-items: center;
		height: 22px;
		gap: 6px;
		padding-right: 8px;
		white-space: nowrap;
		cursor: pointer;
	}
	.row:hover {
		background: var(--vscode-list-hoverBackground);
	}
	.twisty {
		width: 16px;
		height: 16px;
		flex: 0 0 16px;
		border: none;
		background: transparent;
		padding: 0;
		color: var(--vscode-icon-foreground, var(--vscode-foreground));
		cursor: pointer;
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}
	.twisty.empty {
		visibility: hidden;
		cursor: default;
	}
	.twisty::before {
		content: '';
		display: block;
		width: 16px;
		height: 16px;
		background: currentColor;
		mask: url('{{CHEVRON_RIGHT}}') center / 16px no-repeat;
	}
	.twisty.expanded::before { mask-image: url('{{CHEVRON_DOWN}}'); }
	.twisty:disabled::before { display: none; }
	.node-icon {
		width: 16px;
		height: 16px;
		flex: 0 0 16px;
	}
	.icon-dark {
		display: none;
	}
	body.vscode-dark .icon-dark,
	body.vscode-high-contrast:not(.vscode-high-contrast-light) .icon-dark {
		display: inline;
	}
	body.vscode-dark .icon-light,
	body.vscode-high-contrast:not(.vscode-high-contrast-light) .icon-light {
		display: none;
	}
	label.name {
		display: flex;
		align-items: center;
		gap: 6px;
		cursor: pointer;
		min-width: 0;
	}
	label.name span {
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		min-width: 0;
	}
	.empty-note {
		padding: 4px 8px;
		color: var(--vscode-descriptionForeground);
	}
	.options {
		margin-top: 6px;
		padding: 6px 8px 0 8px;
		border-top: 1px solid var(--vscode-panel-border);
		display: flex;
		flex-direction: column;
		gap: 4px;
	}
	.options label {
		display: flex;
		align-items: flex-start;
		gap: 6px;
		cursor: pointer;
		color: var(--vscode-descriptionForeground);
	}
	body.vscode-dark,
	body.vscode-high-contrast:not(.vscode-high-contrast-light) {
		color-scheme: dark;
	}
</style>
</head>
<body>
	<div class="search">
		<input id="q" type="text" placeholder="Поиск подсистем…" autocomplete="off" />
		<button id="clearSearch" class="search-clear hidden" type="button" title="Очистить">×</button>
	</div>
	<div id="tree"></div>
	<div class="options">
		<label><input id="includeNested" type="checkbox" checked /><span>Включать объекты из подчинённых подсистем</span></label>
		<label><input id="includeParents" type="checkbox" /><span>Включать объекты из родительских подсистем</span></label>
	</div>
<div class="options"><button id="reset" type="button">Сбросить отбор</button><button id="collapse" type="button">Свернуть все</button></div>
<script nonce="{{NONCE}}">
const api=acquireVsCodeApi(), tree=document.getElementById('tree'), input=document.getElementById('q');
const nested=document.getElementById('includeNested'),parents=document.getElementById('includeParents');
let nodes=[],checked=new Set(),collapsed=new Set(),generation=-1;
const send=message=>api.postMessage({...message,generation});
const match=node=>node.name.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase())||node.children.some(match);
function render(){
 const fragment=document.createDocumentFragment();
 function row(node,depth){
  if(!match(node))return;
  const el=document.createElement('div');el.className='row';el.style.paddingLeft=(4+depth*8)+'px';
  const twist=document.createElement('button');twist.className='twisty';twist.classList.toggle('expanded',!!input.value||!collapsed.has(node.key));twist.setAttribute('aria-label','Развернуть / свернуть '+node.name);twist.disabled=!node.children.length;
  twist.onclick=()=>{collapsed.has(node.key)?collapsed.delete(node.key):collapsed.add(node.key);render();};el.append(twist);
  const label=document.createElement('label');label.className='name';
  const box=document.createElement('input');box.type='checkbox';box.checked=checked.has(node.key);box.onchange=()=>{box.checked?checked.add(node.key):checked.delete(node.key);send({type:'toggle',key:node.key,checked:box.checked});};
  label.append(box);
  for(const theme of ['light','dark']){const icon=document.createElement('img');icon.className='node-icon icon-'+theme;icon.alt='';icon.src=theme==='light'?'{{ICON_LIGHT}}':'{{ICON_DARK}}';label.append(icon);}
  const text=document.createElement('span');text.textContent=node.name;label.append(text);el.append(label);fragment.append(el);
  if(input.value||!collapsed.has(node.key))node.children.forEach(child=>row(child,depth+1));
 }
 nodes.forEach(node=>row(node,0));if(!fragment.childNodes.length){const empty=document.createElement('p');empty.textContent='Подсистемы не найдены';fragment.append(empty);}tree.replaceChildren(fragment);
}
input.oninput=render;document.getElementById('clearSearch').onclick=()=>{input.value='';render();};
nested.onchange=()=>send({type:'option',option:'includeNested',checked:nested.checked});parents.onchange=()=>send({type:'option',option:'includeParents',checked:parents.checked});
document.getElementById('reset').onclick=()=>send({type:'clear'});document.getElementById('collapse').onclick=()=>send({type:'collapse'});
window.addEventListener('message',({data:m})=>{if(m.type==='tree'){generation=m.generation;nodes=m.nodes;checked=new Set(m.checked);nested.checked=m.options.includeNested;parents.checked=m.options.includeParents;render();}if(m.type==='clearChecked'){checked.clear();render();}if(m.type==='collapseAll'){const visit=ns=>ns.forEach(n=>{collapsed.add(n.key);visit(n.children);});visit(nodes);render();}});
api.postMessage({type:'ready'});
</script></body></html>
